openapi: 3.0.3
info:
  title: Personal Portfolio API
  version: 1.0.0
  description: |
    面试向个人作品集的管理 API。
    公开接口只返回已发布作品；管理接口使用 portfolio_session HttpOnly Cookie。
servers:
  - url: http://localhost:3000/api
    description: Express 开发服务
  - url: http://localhost:5173/api
    description: Vite 开发代理
tags:
  - name: System
    description: 服务状态
  - name: Public Projects
    description: 无需鉴权的作品接口
  - name: Authentication
    description: 管理员会话
  - name: Admin Projects
    description: 需要管理员会话的作品接口
paths:
  /health:
    get:
      tags: [System]
      summary: 健康检查
      operationId: getHealth
      responses:
        "200":
          description: API 正常运行
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /projects:
    get:
      tags: [Public Projects]
      summary: 获取已发布作品
      operationId: listPublishedProjects
      description: |
        只返回 published=true 的作品。
        排序依次为 featured 降序、sortOrder 降序、createdAt 降序。
      responses:
        "200":
          description: 已发布作品列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
  /auth/login:
    post:
      tags: [Authentication]
      summary: 管理员登录
      operationId: login
      description: 成功后设置 portfolio_session Cookie。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          headers:
            Set-Cookie:
              description: HttpOnly 管理会话 Cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthState"
        "401":
          description: 口令错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: 登录失败次数过多
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      tags: [Authentication]
      summary: 退出登录
      operationId: logout
      description: 清除当前管理会话和 Cookie；无有效会话时也返回 204。
      responses:
        "204":
          description: 会话已清除
  /auth/me:
    get:
      tags: [Authentication]
      summary: 查询会话状态
      operationId: getSession
      description: 未登录时返回 authenticated=false，不使用 401。
      responses:
        "200":
          description: 当前会话状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthState"
  /admin/projects:
    get:
      tags: [Admin Projects]
      summary: 获取全部作品
      operationId: listAllProjects
      description: 包含已发布作品和草稿。
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 全部作品列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Admin Projects]
      summary: 新增作品
      operationId: createProject
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: 作品创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: 请求参数不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: 作品 UUID
        schema:
          type: string
          format: uuid
    put:
      tags: [Admin Projects]
      summary: 编辑作品
      operationId: updateProject
      description: 使用完整 ProjectInput 替换指定作品。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "200":
          description: 作品更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: 参数或作品 ID 不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 作品不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: portfolio_session
  responses:
    Unauthorized:
      description: 未登录或会话过期
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: 未授权。
    InternalError:
      description: 未分类服务端错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: 服务器内部错误。
  schemas:
    ProjectTag:
      type: string
      enum: [agent, backend, frontend, fullstack]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          format: password
    AuthState:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
    ProjectInput:
      type: object
      additionalProperties: false
      required:
        - title
        - description
        - techStack
        - tags
        - featured
        - published
        - sortOrder
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 40
        description:
          type: string
          minLength: 1
        repoUrl:
          type: string
          format: uri
          nullable: true
          pattern: "^https?://"
        liveUrl:
          type: string
          format: uri
          nullable: true
          pattern: "^https?://"
        techStack:
          type: array
          minItems: 1
          maxItems: 12
          uniqueItems: true
          items:
            type: string
            minLength: 1
          example: [Vue 3, TypeScript, Node.js]
        coverUrl:
          type: string
          format: uri
          nullable: true
          pattern: "^https?://"
        problem:
          type: string
          nullable: true
        role:
          type: string
          nullable: true
        outcome:
          type: string
          nullable: true
        tags:
          type: array
          maxItems: 12
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ProjectTag"
        featured:
          type: boolean
        published:
          type: boolean
        sortOrder:
          type: integer
    Project:
      allOf:
        - $ref: "#/components/schemas/ProjectInput"
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    ProjectListResponse:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
